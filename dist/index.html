<!doctype html><html lang=es><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Traductor Morse</title><script defer src=bundle.js></script></head><body><main class="container py-5"><header class="text-center mb-4"><h1 class=fw-bold>Traductor Morse</h1><p class=text-secondary>Convierte mensajes de texto a código Morse y descifra mensajes.</header><section class="card shadow border-0"><div class="card-body p-4"><label for=tipoConversion class="form-label fw-bold">Tipo de conversión</label> <select id=tipoConversion class="form-select mb-4"><option value=texto-morse>Texto normal a código Morse<option value=morse-texto>Código Morse a texto normal</select> <label for=entrada id=etiquetaEntrada class="form-label fw-bold">Escribe tu mensaje</label> <textarea id=entrada class="form-control mb-2" rows=5 maxlength=2000 placeholder="Ejemplo: HOLA MUNDO"></textarea><div class="text-end text-secondary mb-3"><small id=contador>0 / 2000</small></div><div class="d-grid gap-2 d-md-flex mb-4"><button id=btnConvertir class="btn btn-primary flex-grow-1">Convertir mensaje</button> <button id=btnLimpiar class="btn btn-outline-secondary">Limpiar</button></div><div id=mensaje class="alert d-none" role=alert></div><h2 class="h5 fw-bold">Resultado</h2><div id=salida class=resultado-texto>Tu resultado aparecerá aquí.</div><button id=btnCopiar class="btn btn-outline-primary mt-3">Copiar resultado</button></div></section><footer class="text-center mt-4 text-secondary"><small>Proyecto académico · Traductor Morse</small></footer></main></body></html>
